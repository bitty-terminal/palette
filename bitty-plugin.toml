# Bitty plugin manifest.
#
# File name, keys, and limits are the accepted v1 contract in bitty-docs
# `docs/specifications/plugin-platform-rfc.md` (OQ-012). The plugin manager and
# the host parse this file independently before any plugin code runs.
#
# `just manifest` validates this file with the authoritative `bitty-plugin-lint`
# from bitty-plugin-sdk (R-SDK-2), pinned by commit in `package.json` and
# `bun.lock`. Run `just install` once to materialize it.

[plugin]
id = "bitty-terminal.palette"
name = "Palette"
version = "0.0.1"
description = "Command palette and picker UI via overlay slot, declarative primitives only"
license = "MIT"

[compat]
# Minimum-only host compatibility (bitty#2462): the floor follows the 0.0.24
# release train this plugin is verified against, and no upper bound is
# declared, so newer hosts (0.0.x and 0.1+) install without a manifest edit.
# The runtime API major remains ^1.0.
bitty = ">=0.0.24"
plugin-api = "^1.0"

[capabilities]
# Deny by default: a single coupled grant. Unknown identifiers fail validation
# and there is no allow-all identifier.
#
# `ui.overlay.focus` (bitty#1971, accepted W-01 overlay-input-capture
# contract) acquires the focusable overlay and holds the single transient
# input-capture session for one interaction. The Core surfaces only the
# capture owner's block, so without this grant the toggle paints invisibly.
# This replaces the former `ui.rich` + `ui.overlay` pair: the spec-acquire
# path (`bitty.ui.overlay.acquire({ title, placeholder })`) mounts the surface
# and starts capture in one Core-owned switch without passing the v1
# `ui.overlay` slot gate, and content updates ride the session-owned
# `bitty.ui.overlay.update`. The v1 presentation slot (`ui.overlay`,
# non-focusable) is therefore unrequested. No filesystem, process, network,
# clipboard, or Terminal Truth authority comes with the grant; release stays
# ungated so cleanup can never wedge input.
ui.overlay.focus = true

[settings]
# Static filter applied to the host command catalog. v1 has no live text-input
# surface for overlays, so the palette cannot type-filter yet; the key is
# declared anyway because `bitty.settings.get` fails closed
# (`E_SETTINGS_UNDECLARED`) for undeclared keys, and an empty string lists the
# whole catalog (bitty CTX-1195).
query = { type = "string", default = "" }

[lazy]
# Static triggers let the host register the plugin without creating a VM.
# Commands are plugin-qualified: `<plugin-id>:<resource>`.
commands = ["bitty-terminal.palette:toggle"]
# Events the plugin subscribes to during activation.
events = ["focus.changed", "overlay.released"]
