# Bitty plugin manifest.
#
# File name, keys, and limits are the accepted v1 contract in bitty-docs
# `docs/specifications/plugin-platform-rfc.md` (OQ-012). The plugin manager and
# the host parse this file independently before any plugin code runs.
#
# `just manifest` validates this file; `bitty-plugin-lint` from
# bitty-plugin-sdk (R-SDK-2) is the authoritative check against the same
# accepted contract.

[plugin]
id = "bitty-terminal.palette"
name = "Palette"
version = "0.1.0"
description = "Command palette and picker UI via overlay slot, declarative primitives only"
license = "MIT"

[compat]
# Unchanged from the bundled `bitty-terminal.palette` realization.
bitty = ">=0.1,<1.0"
plugin-api = "^1.0"

[capabilities]
# Deny by default: omit this table entirely when the plugin needs no authority.
# Unknown identifiers fail validation and there is no allow-all identifier.
#
# `ui.rich` gates `bitty.ui.mount`/`bitty.ui.update`; the `overlay` slot
# additionally requires `ui.overlay`. The bundled Rust realization declared
# only `ui.overlay` because it used the lower-level Panel Runtime overlay path;
# the accepted Plugin API v1 Lua overlay path requires both (ADR 0009 /
# Plugin API v1 Lua Surface RFC). Recorded intentional difference.
ui.rich = true
ui.overlay = true

[lazy]
# Static triggers let the host register the plugin without creating a VM.
# Commands are plugin-qualified: `<plugin-id>:<resource>`.
commands = ["bitty-terminal.palette:toggle"]
# Events the plugin subscribes to during activation.
events = ["focus.changed"]
